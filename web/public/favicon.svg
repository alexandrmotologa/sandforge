<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-optic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="forge-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="plate-lit-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-385
        333,-192
        333,192
        0,385
        -333,192
        -333,-192
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <polygon points="
        0,-350
        303,-175
        303,175
        0,350
        -303,175
        -303,-175
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.45" stroke-dasharray="14, 10" />

      <!-- WATERTIGHT MASCOT SILHOUETTE (Deep Obsidian Base) -->
      <path d="
        M 0 -290
        L 95 -245
        L 175 -180
        L 235 -90
        L 265 20
        L 255 135
        L 210 230
        L 135 295
        L 0 340
        L -135 295
        L -210 230
        L -255 135
        L -265 20
        L -235 -90
        L -175 -180
        L -95 -245
        Z
      " fill="#0b0f19" />

      <!-- TIER 1: CREST & HEAD SHIELD (The Forehead Carapace) -->
      <!-- Center Forehead Crest -->
      <polygon points="0,-280 48,-210 0,-165 -48,-210" fill="#475569" />
      <polygon points="0,-280 0,-165 -48,-210" fill="#334155" />

      <!-- Upper Brow Plates (Left / Right) -->
      <polygon points="0,-280 85,-235 48,-210" fill="#64748b" />
      <polygon points="0,-280 -48,-210 -85,-235" fill="#334155" />

      <polygon points="48,-210 85,-235 110,-175 40,-160" fill="#334155" />
      <polygon points="-48,-210 -40,-160 -110,-175 -85,-235" fill="#1e293b" />

      <!-- Tapered Armored Muzzle & Whisker Facets -->
      <polygon points="0,-165 40,-160 30,-90 0,-70" fill="#334155" />
      <polygon points="0,-165 0,-70 -30,-90 -40,-160" fill="#1e293b" />
      <polygon points="0,-70 25,-85 0,-115" fill="#475569" />
      <polygon points="0,-70 0,-115 -25,-85" fill="#334155" />

      <!-- PREDATOR & SENTINEL OPTICS (Almond Geometric Slits) -->
      <!-- Eye Sockets (Deep obsidian background) -->
      <polygon points="38,-160 95,-165 75,-130 35,-140" fill="#050811" />
      <polygon points="-38,-160 -35,-140 -75,-130 -95,-165" fill="#050811" />

      <!-- Sharp Cyan Eyes (Slanted Upward toward ears) -->
      <polygon points="45,-155 85,-158 68,-137" fill="url(#cyan-optic)" />
      <polygon points="-45,-155 -68,-137 -85,-158" fill="url(#cyan-optic)" />

      <!-- Cheek Shield Flanges (Zygomatic armor) -->
      <polygon points="75,-130 145,-140 160,-75 100,-75" fill="#334155" />
      <polygon points="-75,-130 -100,-75 -160,-75 -145,-140" fill="#1e293b" />

      <!-- TIER 2: OVERLAPPING COW CARAPACE COLLAR (First Snapshot Layer) -->
      <polygon points="0,-45 110,-60 165,-20 85,15 0,0" fill="#475569" />
      <polygon points="0,-45 0,0 -85,15 -165,-20 -110,-60" fill="#1e293b" />

      <polygon points="0,0 85,15 55,75 0,60" fill="#334155" />
      <polygon points="0,0 0,60 -55,75 -85,15" fill="#0f172a" />

      <!-- Lateral Shoulder Armor Plates -->
      <polygon points="165,-20 225,-30 240,40 175,45" fill="#334155" />
      <polygon points="-165,-20 -175,45 -240,40 -225,-30" fill="#0f172a" />

      <polygon points="175,45 240,40 230,115 155,105" fill="#1e293b" />
      <polygon points="-175,45 -155,105 -230,115 -240,40" fill="#0b0f19" />

      <!-- TIER 3: FORGE CORE & ROLLBACK SPHERE SHIELD (Inner Power Chamber) -->
      <!-- Center Forge Hex Core Plate -->
      <polygon points="0,70 45,95 45,155 0,180 -45,155 -45,95" fill="url(#plate-lit-left)" stroke="#00f5ff" stroke-width="3" stroke-linejoin="round" />
      
      <!-- Inner Forge Core Glowing Ingot (Represents SandForge Engine) -->
      <polygon points="0,95 24,110 24,140 0,155 -24,140 -24,110" fill="url(#forge-core)" />
      <polygon points="0,95 0,155 -24,140 -24,110" fill="#ea580c" />
      <polygon points="0,95 24,110 0,155" fill="#fbbf24" />

      <!-- Mid-Body Overlapping Armored Facets -->
      <polygon points="45,95 125,75 140,140 55,160" fill="#334155" />
      <polygon points="-45,95 -55,160 -140,140 -125,75" fill="#1e293b" />

      <polygon points="55,160 140,140 145,210 65,220" fill="#1e293b" />
      <polygon points="-55,160 -65,220 -145,210 -140,140" fill="#0f172a" />

      <!-- TIER 4: LOWER ROLLBACK TAIL & BASE CARAPACE -->
      <polygon points="0,180 55,160 65,220 0,250" fill="#334155" />
      <polygon points="0,180 0,250 -65,220 -55,160" fill="#0f172a" />

      <!-- Lower Rollback Claws / Base Ingot Footing -->
      <polygon points="0,250 65,220 105,270 0,315" fill="#1e293b" />
      <polygon points="0,250 0,315 -105,270 -65,220" fill="#0b0f19" />

      <!-- Outer Shell Accent Vectors (Subtle cyan guidance markers) -->
      <line x1="0" y1="-285" x2="0" y2="-340" stroke="#00f5ff" stroke-width="4" stroke-linecap="round" opacity="0.7" />
      <circle cx="0" cy="-345" r="4" fill="#00f5ff" />

      <line x1="0" y1="320" x2="0" y2="345" stroke="#00f5ff" stroke-width="4" stroke-linecap="round" opacity="0.7" />
      <circle cx="0" cy="350" r="4" fill="#00f5ff" />

    </g>
  </g>
</svg>